name: Secure Pipeline 

on: 
  push: 
    branches: 
      - main

jobs: 
  build_and_package: 
    name: BUILD-JOB 
    runs-on: ubuntu-latest

    steps: 
      - name: Checkout Code 
        uses: actions/checkout@v4 
      
      - name: BUILD 
        run: npm install 
      
      - name: TEST 
        run: echo "code is tested!" 
        
      - name: Artifact upload 
        uses: actions/upload-artifact@v7 
        with: 
          name: artifact-1 
          path: | 
            package*
